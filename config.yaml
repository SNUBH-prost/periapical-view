# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 치근단 방사선 사진 자동 수집 설정
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── 실행 모드 ────────────────────────────────────────
# "ui"      : Infinitt 클라이언트 우클릭 메뉴 자동화 (권장)
# "monitor" : 임시 파일 폴더 감시 (ui 모드 보조)
# "dicom"   : DICOM 직접 연결 (서버 IP 아는 경우)
mode: "ui"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# [모드 1] Infinitt UI 자동화 설정 (mode: ui)
# Infinitt 클라이언트 창에서 우클릭 → 파일 저장을 자동으로 수행
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
ui:
  # Infinitt 창 제목에 포함된 문자열 (일부만 입력해도 됨)
  window_title_contains: "Infinitt"

  # 우클릭 메뉴에서 클릭할 항목 이름 (실제 메뉴 텍스트에 맞게 수정)
  # 한글/영문 모두 입력해두면 자동으로 찾음
  save_menu_items:
    - "Save Image"
    - "Export"
    - "이미지 저장"
    - "저장"
    - "Export Image"
    - "Save as"
    - "Convert"
    - "JPEG로 저장"
    - "PNG로 저장"

  # 이미지 저장 대화상자가 뜰 때 저장 버튼 텍스트
  save_dialog_button: "저장"

  # 저장되는 이미지 파일 확장자 (Infinitt 저장 형식에 맞추세요)
  # png / jpg / bmp / dcm 등
  save_extension: "png"

  # 저장 폴더 (Infinitt 저장 대화상자에서 이 경로로 자동 이동)
  infinitt_save_dir: "C:\\infinitt_export"

  # 액션 사이 대기 시간 (초) - 너무 빠르면 오류 발생
  action_delay: 0.5

  # 단축키: Infinitt에서 이 키를 누르면 현재 이미지 저장
  hotkey: "f9"

  # ── 배치 모드 타이밍 (--excel 사용 시) ─────────────────────
  # 검색 후 결과 목록이 뜰 때까지 대기 (초)
  wait_after_search: 2.0
  # 스터디 열기 후 이미지가 로드될 때까지 대기 (초)
  wait_after_open: 3.0

  # ── 5년치 수집 설정 ──────────────────────────────────────────
  # 환자당 최대 처리할 스터디 수 (내원 횟수 상한)
  # 5년 × 평균 분기 1회 내원 = 약 20회
  max_studies_per_patient: 20

  # 스터디 목록에서 뒤로 돌아갈 때 사용할 키
  # "escape" 또는 "backspace" (Infinitt 설정에 따라 변경)
  back_key: "escape"

  # ── 검사명 필터 & 수집 기간 ──────────────────────────────────
  # 수집할 검사명 키워드 (대소문자 무관, 부분 일치)
  # Infinitt 검사명이 정확히 "DS periapical view (implant)" 인 경우
  study_name_filter:
    - "DS periapical view (implant)"

  # 최근 몇 년치를 수집할지 (기본 5년)
  years_back: 5

  # 목록 스크롤 최대 페이지 수 (한 환자당)
  max_scroll_pages: 30

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# [모드 2] 임시 파일 감시 설정 (mode: monitor)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
monitor:
  watch_dirs:
    - "C:\\Users\\%USERNAME%\\AppData\\Local\\Temp"
    - "C:\\ProgramData\\Infinitt"
    - "C:\\Infinitt"
    - "C:\\infinitt_export"   # ui 모드가 저장한 폴더도 감시
  extensions: [".dcm", ".DCM", ".jpg", ".jpeg", ".png", ""]
  min_file_size: 10000
  settle_seconds: 2
  processed_log: "./output/processed_files.txt"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# [모드 3] DICOM 직접 연결 (mode: dicom)
# 정보팀에서 아래 정보를 받으면 입력하세요:
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
dicom:
  server:
    host: ""          # PACS 서버 IP (예: 192.168.1.100)
    port: 104         # DICOM 기본 포트 (보통 104)
    ae_title: ""      # PACS AE Title (예: INFINITT)
  calling_ae_title: "PERIAPICAL_SCU"
  search:
    modality: "IO"
    date_from: "20230101"
    date_to: "20251231"
    max_studies: 0

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 출력 설정 (공통)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
output:
  base_dir: "./output"
  save_dicom: true
  save_image: true
  image_format: "png"
  image_quality: 95
  organize_by_patient: true

deidentify:
  enabled: true
  remove_tags:
    - "PatientName"
    - "PatientBirthDate"
    - "PatientSex"
    - "PatientAge"
    - "PatientAddress"
    - "ReferringPhysicianName"
    - "InstitutionName"
    - "InstitutionAddress"
  anonymize_patient_id: true

filter:
  allowed_modalities: ["IO"]
  min_pixel_size: 100
