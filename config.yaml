# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 치근단 방사선 사진 자동 수집 설정 파일
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── 실행 모드 ────────────────────────────────────────
# "monitor"  : Infinitt 클라이언트가 열어보는 이미지를 실시간 수집 (권장)
# "dicom"    : DICOM 프로토콜로 PACS 서버에서 직접 일괄 다운로드
mode: "monitor"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# [모드 1] 임시 파일 모니터링 설정 (mode: monitor)
# Infinitt 클라이언트가 이미지를 열 때 PC에 저장하는
# 캐시/임시 파일을 감시하여 자동으로 수집합니다.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
monitor:
  # Infinitt 클라이언트가 임시 파일을 저장하는 폴더들
  # (find_pacs_config.bat 실행 후 자동으로 채워집니다)
  watch_dirs:
    - "C:\\Users\\%USERNAME%\\AppData\\Local\\Temp"
    - "C:\\ProgramData\\Infinitt"
    - "C:\\Infinitt"

  # 감시할 파일 확장자
  extensions: [".dcm", ".DCM", ""]   # 확장자 없는 DICOM도 있음

  # 파일 최소 크기 (bytes) - 너무 작은 파일 무시
  min_file_size: 10000

  # 새 파일 감지 후 처리 대기 시간 (초) - 파일 쓰기 완료 대기
  settle_seconds: 2

  # 이미 처리한 파일 기록 (재시작해도 중복 처리 안 함)
  processed_log: "./output/processed_files.txt"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# [모드 2] DICOM 직접 연결 설정 (mode: dicom)
# find_pacs_config.bat 실행 후 서버 정보가 자동으로 채워집니다.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
dicom:
  server:
    host: ""          # 자동 탐색 후 채워짐 (예: 192.168.1.100)
    port: 104         # DICOM 기본 포트
    ae_title: ""      # PACS AE Title (예: INFINITT)

  # 이 PC의 DICOM AE Title (아무 이름이나 가능)
  calling_ae_title: "PERIAPICAL_SCU"

  # 검색 조건
  search:
    modality: "IO"          # IO = 구내방사선(치근단)
    date_from: "20230101"   # YYYYMMDD
    date_to: "20251231"
    max_studies: 0          # 0 = 전체

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 출력 설정 (두 모드 공통)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
output:
  base_dir: "./output"
  save_dicom: true          # 비식별화 DICOM 저장
  save_image: true          # PNG/JPEG 저장
  image_format: "png"       # "png" 또는 "jpeg"
  image_quality: 95

# DICOM 비식별화 (AI 학습용)
deidentify:
  enabled: true
  remove_tags:
    - "PatientName"
    - "PatientBirthDate"
    - "PatientSex"
    - "PatientAge"
    - "PatientAddress"
    - "ReferringPhysicianName"
    - "InstitutionName"
    - "InstitutionAddress"
  anonymize_patient_id: true

# DICOM 필터 (구내방사선만 수집)
filter:
  # 모달리티 필터 (비어있으면 모든 모달리티)
  # IO = 구내방사선, PX = 파노라마, CT = CBCT
  allowed_modalities: ["IO"]

  # 스터디 설명 키워드 필터 (비어있으면 모달리티만으로 판단)
  # description_keywords: ["periapical", "PA", "치근단"]

  # 최소 이미지 크기 (픽셀)
  min_pixel_size: 100
